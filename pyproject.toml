[project]
name = "xhs-research"
version = "0.1.0"
description = "Search Xiaohongshu and generate AI-powered research reports"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "playwright>=1.44.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
xhs-research = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]
