[project]
name = "xhs-research"
version = "0.2.0"
description = "Search Xiaohongshu and generate AI-powered research reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "playwright>=1.44.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
xhs-research = "xhs_research.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xhs_research*"]
